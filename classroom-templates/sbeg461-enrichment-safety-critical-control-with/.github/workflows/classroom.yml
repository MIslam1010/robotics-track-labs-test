name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Lab tests
      id: lab-tests
      uses: classroom-resources/autograding-python-grader@v1
      env:
        LAB_IMPL: 'starter'
      with:
        timeout: 20
        max-score: 100
        setup-command: sh .github/classroom-setup.sh
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        LAB-TESTS_RESULTS: "${{steps.lab-tests.outputs.result}}"
      with:
        runners: lab-tests
