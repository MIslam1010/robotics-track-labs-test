# Conda alternative (recommended on Windows):
#   conda env create -f environment.yml && conda activate sbeg361-labs
name: sbeg361-labs
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - matplotlib
  - pip
  - pip:
    - cmake==4.3.4
    - modern_robotics==1.1.1
    - ninja==1.11.1.4
    - pytest==9.1.1
    - roboticstoolbox-python==1.4.4
    - -e ./library
