name: GitHub Classroom templates (real grader)
# Each template is laid out as a student's assignment repository and graded by the GitHub Classroom grader actions:
# untouched starter (must score < 100 without errors) and reference solution (must score 100), Python and C++.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['classroom-templates/**', 'ci/classroom_*', '.github/workflows/classroom-check.yml', 'cpp_support/**']
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.m.outputs.m }}
    steps:
    - uses: actions/checkout@v4
    - id: m
      run: echo "m=$(jq -c . ci/classroom_matrix.json)" >> "$GITHUB_OUTPUT"
  grade:
    needs: list
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.list.outputs.m) }}
    name: ${{ matrix.t.name }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Decrypt the solutions (repository secret; never printed)
      env:
        SOLUTIONS_KEY: ${{ secrets.SOLUTIONS_KEY }}
      run: |
        if [ -z "$SOLUTIONS_KEY" ]; then echo "SOLUTIONS_KEY secret not available"; exit 1; fi
        printf '%s' "$SOLUTIONS_KEY" > "$RUNNER_TEMP/k"
        openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in solutions.tar.gz.enc -pass "file:$RUNNER_TEMP/k" | tar xz
        rm -f "$RUNNER_TEMP/k"
    - name: lay out the template as an assignment repository
      run: |
        mv solutions "$RUNNER_TEMP/sol"
        cp ci/classroom_check.py "$RUNNER_TEMP/"
        mkdir "$RUNNER_TEMP/t" && cp -a "classroom-templates/${{ matrix.t.name }}/." "$RUNNER_TEMP/t/"
        if [ -f "$RUNNER_TEMP/t/LANGUAGE" ]; then cp -a cpp_support "$RUNNER_TEMP/t/"; fi
        find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
        cp -a "$RUNNER_TEMP/t/." .
        ls
    - name: Grader - Python, untouched starter
      id: py-st
      if: always()
      uses: classroom-resources/autograding-python-grader@v1
      env:
        LAB_IMPL: starter
        PYTHONPATH: ${{ matrix.t.pythonpath }}
      with:
        timeout: ${{ matrix.t.timeout }}
        max-score: 100
        setup-command: sh .github/classroom-setup.sh
    - name: add the Python reference solution
      if: matrix.t.kind == 'lab'
      run: rm -rf autograding_output && cp "$RUNNER_TEMP"/sol/${{ matrix.t.sol }}/*.py .
    - name: Grader - Python, reference solution
      id: py-sol
      if: matrix.t.kind == 'lab'
      uses: classroom-resources/autograding-python-grader@v1
      env:
        LAB_IMPL: solution
        PYTHONPATH: ${{ matrix.t.pythonpath }}
      with:
        timeout: ${{ matrix.t.timeout }}
        max-score: 100
        setup-command: sh .github/classroom-setup.sh
    - name: switch LANGUAGE to cpp (as a student does)
      if: matrix.t.cpp
      run: rm -rf autograding_output && sed -i '1s/.*/cpp/' LANGUAGE
    - name: Grader - C++, untouched starter
      id: cpp-st
      if: matrix.t.cpp
      uses: classroom-resources/autograding-python-grader@v1
      env:
        LAB_IMPL: starter
        PYTHONPATH: ${{ matrix.t.pythonpath }}
      with:
        timeout: ${{ matrix.t.timeout }}
        max-score: 100
        setup-command: sh .github/classroom-setup.sh
    - name: add the C++ reference solution
      if: matrix.t.cpp
      run: rm -rf autograding_output build && for f in "$RUNNER_TEMP"/sol/${{ matrix.t.sol }}/cpp/solution*; do cp "$f" cpp/; done
    - name: Grader - C++, reference solution
      id: cpp-sol
      if: matrix.t.cpp
      uses: classroom-resources/autograding-python-grader@v1
      env:
        LAB_IMPL: solution
        PYTHONPATH: ${{ matrix.t.pythonpath }}
      with:
        timeout: ${{ matrix.t.timeout }}
        max-score: 100
        setup-command: sh .github/classroom-setup.sh
    - name: Autograding Reporter (as in classroom.yml), reference solution
      if: matrix.t.kind == 'lab'
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        PY-SOL_RESULTS: "${{ steps.py-sol.outputs.result }}"
      with:
        runners: py-sol
    - name: scores
      if: always()
      env:
        KIND: ${{ matrix.t.kind }}
        PY_ST: ${{ steps.py-st.outputs.result }}
        PY_SOL: ${{ steps.py-sol.outputs.result }}
        CPP_ST: ${{ steps.cpp-st.outputs.result }}
        CPP_SOL: ${{ steps.cpp-sol.outputs.result }}
      run: python3 "$RUNNER_TEMP/classroom_check.py"
